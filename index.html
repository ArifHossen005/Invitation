<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8cdc4" />
<title>শুভ বিবাহ — সাথী ও আরিফ</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Amiri:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet" />

<style>
:root{
  --red:#c4122f; --red-dark:#9d0f26; --gold:#c39a2e; --paper:#fbfbf6; --peach:#f8cdc4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--red); overflow-x:hidden;
  font-family:'Hind Siliguri','Noto Serif Bengali',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 600px at 8% -10%, #fff0ea, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #f9d5d0, transparent 60%),
    linear-gradient(180deg,#fbe2db,#f4c3be 60%,#f0b5b2);
  background-attachment:fixed;
}
a{color:inherit}

/* ---------- falling petals ---------- */
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petals span{
  position:absolute; top:-6vh; opacity:.55;
  background:linear-gradient(135deg,#ffe0e0,#f2a0ad);
  border-radius:70% 0 70% 0; animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translate3d(0,-6vh,0) rotate(0deg)}
  50%{transform:translate3d(46px,55vh,0) rotate(200deg)}
  100%{transform:translate3d(-24px,112vh,0) rotate(380deg)}
}

/* ---------- cover ---------- */
.cover-wrap{
  position:relative; z-index:1; min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; padding:28px 16px 40px;
}
.cover{
  position:relative; aspect-ratio:2/3; container-type:inline-size; border-radius:6px;
  width:min(92vw,460px);
  width:min(92vw, calc((100svh - 150px) * .6667), 460px);
  box-shadow:0 44px 80px -30px rgba(120,20,40,.6),0 14px 32px -10px rgba(120,20,40,.35);
  animation:coverIn 1.1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes coverIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.cover-art{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px}
.twinkle{animation:twinkle 3.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.95}}
.cover-text{position:absolute;left:46%;right:7%;top:46%;text-align:center}
.cover-title{
  margin:0; font-family:'Tiro Bangla','Noto Serif Bengali',serif; font-weight:400; line-height:1.12;
  font-size:clamp(40px,11vw,66px); font-size:15cqw; color:#a50f2b;
  text-shadow:0 1px 0 #ffeae7,0 3px 8px rgba(165,15,43,.25);
}
.cover-title span{display:block}
.cover-invite{
  font-family:'Great Vibes',cursive; font-size:clamp(30px,9vw,54px); font-size:12.5cqw; line-height:1.25; margin-top:3cqw;
  background:linear-gradient(135deg,#7a5200,#c9971f 40%,#f0d77a 55%,#9a6b0c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cover-flourish{width:70%;margin:1cqw auto 0;display:block}
.open-hint{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--red-dark);font-size:.95rem}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ---------- inside ---------- */
main{position:relative;z-index:1;padding:20px 16px 70px}
.sec-title{
  text-align:center; margin:0 auto 26px; font-family:'Tiro Bangla',serif; font-weight:400;
  font-size:clamp(1.5rem,3vw,2rem); color:var(--red-dark);
}
.book{
  max-width:1100px; margin:0 auto; position:relative;
  display:grid; grid-template-columns:1fr 1fr; padding:14px; border-radius:14px;
  background:
    radial-gradient(circle at 20px 20px, rgba(255,255,255,.38) 0 6px, transparent 7px) 0 0/40px 40px,
    #f7c8be;
  box-shadow:0 50px 90px -40px rgba(120,20,40,.6),0 10px 30px -12px rgba(120,20,40,.35);
}
.book::after{
  content:''; position:absolute; top:14px; bottom:14px; left:50%; width:40px; transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(110,50,40,.18),transparent); pointer-events:none;
}
.page{
  position:relative; display:flex; flex-direction:column; min-height:700px;
  padding:clamp(56px,7vw,76px) clamp(26px,5vw,52px);
  background:
    radial-gradient(600px 300px at 50% 0%, rgba(255,255,255,.9), transparent 70%),
    linear-gradient(180deg,#fdfdf9,#f3f7f1);
}
.page.left{border-radius:6px 0 0 6px}
.page.right{border-radius:0 6px 6px 0}
@media(max-width:900px){
  .book{grid-template-columns:1fr;gap:14px}
  .book::after{display:none}
  .page.left,.page.right{border-radius:6px}
  .page{min-height:0}
}
.corner{position:absolute;width:clamp(58px,8vw,88px);height:auto;pointer-events:none}
.corner.tl{top:10px;left:10px}
.corner.tr{top:10px;right:10px;transform:scaleX(-1)}
.corner.bl{bottom:10px;left:10px;transform:scaleY(-1)}
.corner.br{bottom:10px;right:10px;transform:scale(-1,-1)}

.head{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 24px}
.head h2{margin:0;font-family:'Tiro Bangla',serif;font-weight:400;font-size:clamp(1.7rem,3vw,2.1rem);line-height:1.2}
.wing{
  flex:0 0 clamp(46px,11vw,80px); height:16px;
  background:repeating-linear-gradient(to bottom,var(--red) 0 2px,transparent 2px 6px);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 45%);
          mask-image:linear-gradient(to right,transparent,#000 45%);
}
.wing.r{transform:scaleX(-1)}

.ident{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}
.ident + .ident{margin-top:22px}
.kvs{flex:1 1 auto;min-width:0}
.ident .illus{flex:0 0 32%;max-width:170px}
.ident .illus svg{width:100%;height:auto;display:block}
.kv{
  display:grid; grid-template-columns:var(--kw,4.3em) 1em 1fr; align-items:baseline;
  font-size:clamp(1.02rem,1.5vw,1.2rem); line-height:1.8;
}
.kv .k{font-weight:500}
.kv.strong .k,.kv.strong .v{font-weight:700}
.kv.strong .v{font-size:1.18em;font-family:'Tiro Bangla','Hind Siliguri',serif;font-weight:400}
.kv.strong .k{font-family:'Hind Siliguri',sans-serif}

.divider-ornament{margin:24px auto 22px;width:60%;height:14px;opacity:.9}

.schedule{display:flex;align-items:center;justify-content:space-between;gap:14px}
.schedule .kvs{--kw:6.6em}
.seal{
  flex:0 0 auto; width:clamp(84px,14vw,104px); aspect-ratio:1; border-radius:50%;
  border:2px solid var(--red); outline:1px solid var(--red); outline-offset:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Tiro Bangla',serif; line-height:1.15; font-size:clamp(1rem,1.7vw,1.2rem);
  background:radial-gradient(circle,#fff,#fdf0ee);
}

/* letter */
.letter{flex:1;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.bismillah{font-family:'Amiri',serif;font-size:clamp(1.8rem,3.2vw,2.3rem);line-height:1.6;direction:rtl}
.bism-bn{font-size:.9rem;opacity:.85;margin-top:-4px}
.letter p{margin:0;font-size:clamp(1rem,1.5vw,1.16rem);line-height:2.1}
.letter .salam{font-weight:500;margin-top:14px}
.letter .who{
  display:block; font-family:'Tiro Bangla',serif; font-size:clamp(1.35rem,2.4vw,1.7rem); line-height:1.7; font-weight:400;
}
.letter .flow{margin:16px 0 0}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin-top:26px;font-size:clamp(.95rem,1.3vw,1.05rem)}
.contacts .col-r{text-align:right}
.contacts b{font-weight:600}
.contacts a{text-decoration:none;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.contacts a:hover{text-decoration:underline}
.contacts .line{line-height:1.7;margin-top:2px}
.swirl{width:min(200px,60%);margin:14px auto 6px;display:block}
.welcome{font-size:1rem;line-height:1.9;margin-top:6px}
.welcome .lbl{font-weight:600;display:block;margin-bottom:2px}
@media(max-width:480px){
  .ident .illus{flex-basis:28%}
  .contacts{grid-template-columns:1fr;text-align:center}
  .contacts .col-r{text-align:center}
}

/* countdown + actions */
.extra{max-width:860px;margin:54px auto 0;text-align:center}
.extra h3{font-family:'Tiro Bangla',serif;font-weight:400;font-size:clamp(1.4rem,3vw,1.8rem);color:var(--red-dark);margin:0 0 16px}
.cd-card.ant-card{
  border-radius:16px; background:rgba(255,255,255,.75); backdrop-filter:blur(6px);
  border:1px solid rgba(196,18,47,.18); box-shadow:0 12px 30px -16px rgba(120,20,40,.5);
}
.cd-card .ant-statistic-title{color:var(--red-dark);font-size:.95rem;margin-bottom:2px}
.cd-card .ant-statistic-content{color:var(--red);font-family:'Tiro Bangla',serif;font-size:clamp(1.8rem,6vw,2.6rem)}
.actions{margin-top:26px}
.closing{margin-top:44px;color:var(--red-dark);line-height:1.9;font-size:1.05rem}
.closing .fam{font-family:'Tiro Bangla',serif;font-size:1.35rem}

/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
@media print{
  .petals,.no-print{display:none!important}
  .reveal{opacity:1;transform:none}
  body{background:#fff}
}
</style>

const Reveal = ({ children, delay = 0, className = '' }) => {
  const ref = React.useRef(null);
  const [shown, setShown] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!('IntersectionObserver' in window)) { setShown(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setShown(true); io.disconnect(); }
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} className={`reveal ${shown ? 'in' : ''} ${className}`} style={{ transitionDelay: delay + 'ms' }}>
      {children}
    </div>
  );
};

        <rect x="6" y="6" width="388" height="588" fill="none" stroke="url(#goldUS)" strokeWidth="2.6" />

        <rect x="31" y="31" width="338" height="538" fill="none" stroke="#dcc270" strokeWidth="1" />

        <g clipPath="url(#panelClip)">

          {LEAVES.map((d, i) => (

              <path d={d} fill="#f7cec9" />
              <path d={d} fill="none" stroke="#c9a032" strokeWidth="2.4" strokeDasharray="0.1 5" strokeLinecap="round" />

        <path d={EDGE} transform="translate(8 0)" fill="none" stroke="#d9bd62" strokeWidth="1.2" strokeDasharray="0.1 5" strokeLinecap="round" />

        {/* medallion with palki */}
        <g transform="translate(268 160)">
          <circle r="74" fill="#f9dcd8" stroke="#d9bd62" strokeWidth="1.3" />
          <circle r="66" fill="none" stroke="#c9a032" strokeWidth="2.4" strokeDasharray="0.1 6" strokeLinecap="round" />
          {Array.from({ length: 12 }).map((_, i) => (
            <path key={i} transform={`rotate(${i * 30})`} d="M0 -76 C7 -85 7 -91 0 -98 C-7 -91 -7 -85 0 -76Z" fill="none" stroke="#c9a032" strokeWidth="1.4" />
          ))}
          <g transform="translate(-52 -40) scale(.8)"><PalkiShapes stroke="#a67d17" sw={2.8} /></g>

      <div className="cover-text">
        <h1 className="cover-title"><span>শুভ</span><span>বিবাহ</span></h1>
        <div className="cover-invite">Invitation</div>
        <Flourish color="#b58d22" className="cover-flourish" />
      </div>
    </div>

    <div className="open-hint no-print">
      <Button type="primary" size="large" shape="round" onClick={onOpen} style={{ paddingInline: 30, boxShadow: '0 10px 24px -8px rgba(196,18,47,.6)' }}>
        কার্ডটি খুলুন
      </Button>
      <span className="bounce" aria-hidden="true">⌄</span>
    </div>
  </section>
);

/* ---------- inside pages ---------- */
const Head = ({ children }) => (
  <div className="head"><span className="wing" /><h2>{children}</h2><span className="wing r" /></div>
);
const KV = ({ k, v, strong }) => (
  <div className={`kv ${strong ? 'strong' : ''}`}><span className="k">{k}</span><span>:</span><span className="v">{v}</span></div>
);
const Corners = () => (<><Corner pos="tl" /><Corner pos="tr" /><Corner pos="bl" /><Corner pos="br" /></>);

const PageIdentity = () => {
  const { bride, groom, event } = DATA;
  return (
    <article className="page left">
      <Corners />
      <Reveal>
        <Head>পরিচিতি</Head>

        <div className="ident">
          <div className="kvs">
            <KV strong k="কনে" v={bride.name} />
            <KV k="পিতা" v={bride.father} />
            <KV k="মাতা" v={bride.mother} />
            <KV k="ঠিকানা" v={bride.address} />
          </div>
          <div className="illus"><Floral /></div>
        </div>

        <div className="ident">
          <div className="illus" style={{ flexBasis: '34%' }}><PalkiSvg /></div>
          <div className="kvs">
            <KV strong k="বর" v={groom.name} />
            <KV k="পিতা" v={groom.father} />
            <KV k="মাতা" v={groom.mother} />
            <KV k="ঠিকানা" v={groom.address} />
          </div>
        </div>
      </Reveal>

      <Flourish className="divider-ornament" />

      <Reveal delay={120}>
        <Head>অনুষ্ঠানসূচি</Head>
        <div className="schedule">

            <KV k="রোজ" v={event.day} />
            <KV k="প্রীতিভোজ" v={event.feast} />
            <KV strong k="স্থান" v={event.venue} />
          </div>
          <div className="seal" aria-hidden="true"><span>শুভ</span><span>বিবাহ</span></div>

};

const PageLetter = () => {

      <Corners />
      <Reveal className="letter" delay={80}>
        <div>

          <div className="bism-bn">বিসমিল্লাহির রাহমানির রাহিম</div>

          <p className="salam">জনাব / জনাবা,<br />আসসালামু আলাইকুম,</p>

            পরম করুণাময় মহান আল্লাহ তা'আলার অশেষ রহমতে আগামী<br />
            {event.dateEn} {event.dateBn}, রোজ {event.day}<br />
            আমাদের স্নেহের কন্যা

          </p>
          <p className="flow">
            উক্ত অনুষ্ঠানে আপনার/আপনাদের উপস্থিতি ও দোয়া<br />আন্তরিকভাবে কামনা করছি।
          </p>

        <div>
          <div className="contacts">
            <div>
              <b>প্রয়োজনে:</b>
              {contacts.map((c) => (

                </div>

            <div className="col-r">

/* ---------- countdown / actions ---------- */
const useNow = () => {
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  return now;
};

const Countdown = () => {
  const now = useNow();
  const diff = Math.max(0, TARGET - now);
  const d = Math.floor(diff / 864e5);
  const h = Math.floor((diff % 864e5) / 36e5);
  const m = Math.floor((diff % 36e5) / 6e4);
  const s = Math.floor((diff % 6e4) / 1e3);
  const cells = [['দিন', d], ['ঘণ্টা', h], ['মিনিট', m], ['সেকেন্ড', s]];
  if (diff === 0) {
    return <h3 style={{ margin: 0 }}>শুভ দিনটি এসে গেছে — আপনাদের দোয়া ও উপস্থিতি কামনা করছি</h3>;
  }
  return (
    <Row gutter={[12, 12]} justify="center">
      {cells.map(([label, val]) => (
        <Col key={label} xs={12} sm={6}>
          <Card className="cd-card" bordered={false} styles={{ body: { padding: '18px 8px' } }}>
            <Statistic title={label} value={val} formatter={() => bn(String(val).padStart(2, '0'))} />
          </Card>
        </Col>
      ))}
    </Row>
  );
};

const App = () => {
  const [messageApi, contextHolder] = message.useMessage();
  const { event, bride, groom } = DATA;

  const [opened, setOpened] = React.useState(false);
  const openCard = () => setOpened(true);
  React.useEffect(() => {
    if (!opened) return;
    const t = setTimeout(() => {
      const el = document.getElementById('inside');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
    return () => clearTimeout(t);
  }, [opened]);

  const addToCalendar = () => {
    const ics = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wedding Invitation//BN', 'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:wedding-2026-10-09@invitation',
      'DTSTAMP:20260919T000000Z',
      'DTSTART:20261009T073000Z',
      'DTEND:20261009T103000Z',
      `SUMMARY:${event.title} – ${bride.name} ও ${groom.name}`,
      `LOCATION:${event.venue}`,
      `DESCRIPTION:প্রীতিভোজ – ${event.feast}`,
      'END:VEVENT', 'END:VCALENDAR',
    ].join('\r\n');
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'shuvo-bibaho.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    messageApi.success('ক্যালেন্ডার ফাইল ডাউনলোড হয়েছে');
  };

  const share = async () => {
    const data = { title: 'শুভ বিবাহের আমন্ত্রণ', text: `${bride.name} ও ${groom.name} — ${event.title}, ${event.dateEn}`, url: location.href };
    if (navigator.share) {
      try { await navigator.share(data); } catch (e) { /* cancelled */ }
    } else {
      try { await navigator.clipboard.writeText(location.href); messageApi.success('লিংক কপি হয়েছে'); }
      catch (e) { messageApi.info(location.href); }
    }
  };

  return (
    <>
      {contextHolder}
      <GlobalDefs />
      <Petals />
      <Cover onOpen={openCard} />

      {opened && (
      <main id="inside">
        <Reveal><h2 className="sec-title">আপনাদের সাদর আমন্ত্রণ</h2></Reveal>
        <div className="book">
          <PageIdentity />
          <PageLetter />
        </div>

        <section className="extra">
          <Reveal>
            <h3>শুভ দিনের অপেক্ষায়</h3>
            <Countdown />
            <Space wrap size="middle" className="actions no-print" style={{ justifyContent: 'center' }}>
              <Button type="primary" size="large" shape="round" onClick={addToCalendar}>📅 ক্যালেন্ডারে যুক্ত করুন</Button>
              <Button size="large" shape="round" onClick={share}>🔗 শেয়ার করুন</Button>
            </Space>
          </Reveal>

          <Reveal delay={100}>
            <Divider style={{ borderColor: 'rgba(196,18,47,.3)', marginTop: 44 }}>❦</Divider>
            <div className="closing">
              আপনাদের উপস্থিতি ও দোয়াই আমাদের সবচেয়ে বড় উপহার।<br />
              <span className="fam">{DATA.signers[0]} ও {DATA.signers[1]}</span>
            </div>
          </Reveal>
        </section>
      </main>
      )}
    </>
  );
};

const Root = () => (
  <ConfigProvider
    theme={{
      token: {
        colorPrimary: '#b3122d',
        borderRadius: 12,
        fontFamily: "'Hind Siliguri','Noto Serif Bengali',system-ui,sans-serif",
      },
    }}
  >
    <App />
  </ConfigProvider>
);

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
